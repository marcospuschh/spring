name: Build PTZR Spring

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS (VST3 + AU, universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package (pasta PTZR.PLUGINS)
        run: |
          mkdir -p "dist/VST3/PTZR.PLUGINS" "dist/Components"
          VST3=$(find build -type d -name "PTZR Spring.vst3" -print -quit)
          AU=$(find build -type d -name "PTZR Spring.component" -print -quit)
          cp -R "$VST3" "dist/VST3/PTZR.PLUGINS/"
          cp -R "$AU" "dist/Components/"
          codesign --force --deep --sign - "dist/VST3/PTZR.PLUGINS/PTZR Spring.vst3"
          codesign --force --deep --sign - "dist/Components/PTZR Spring.component"
          cp scripts/install_mac.command dist/
          chmod +x dist/install_mac.command
          # zip preserva permissões
          cd dist && zip -r -y ../PTZR-Spring-macOS.zip . && cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: PTZR-Spring-macOS
          path: PTZR-Spring-macOS.zip

  windows:
    name: Windows (VST3)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package (pasta PTZR.PLUGINS)
        shell: bash
        run: |
          mkdir -p "dist/VST3/PTZR.PLUGINS"
          VST3=$(find build -type d -name "PTZR Spring.vst3" -print -quit)
          cp -R "$VST3" "dist/VST3/PTZR.PLUGINS/"

      - uses: actions/upload-artifact@v4
        with:
          name: PTZR-Spring-Windows
          path: dist
